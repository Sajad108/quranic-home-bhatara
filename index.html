
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>দি কুরআনিক হোম ভাটেরা - রেজিস্ট্রেশন</title>
<style>
body{font-family:sans-serif;background:#f0f7f1;padding:15px}
.card{max-width:450px;margin:20px auto;padding:22px;background:white;border-radius:15px;box-shadow:0 2px 12px #ccc}
h2{text-align:center;color:#126b40}
label{display:block;margin-top:14px}
input,select,button{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border-radius:7px;border:1px solid #bbb;font-size:16px}
button{background:#126b40;color:white;border:0;margin-top:22px}
</style>
</head>
<body>
<div class="card">
<h2>দি কুরআনিক হোম ভাটেরা</h2>
<p style="text-align:center">১২ বছর পূর্তি উপলক্ষে অনলাইন রেজিস্ট্রেশন</p>

<form id="regForm">
<label>শিক্ষার্থীর নাম *</label>
<input name="student_name" required>

<label>শিক্ষার্থীর মোবাইল নম্বর *</label>
<input name="mobile" type="tel" required>

<label>অভিভাবকের নাম *</label>
<input name="guardian_name" required>

<label>অভিভাবকের মোবাইল নম্বর</label>
<input name="guardian_mobile" type="tel">

<label>শ্রেণি *</label>
<select name="class_name" required>
<option value="">শ্রেণি নির্বাচন করুন</option>
<option>নূরানী</option>
<option>নাজেরা</option>
<option>হিফজ</option>
<option>অন্যান্য</option>
</select>

<label>ঠিকানা *</label>
<input name="address" required>

<button id="submitBtn" type="submit">রেজিস্ট্রেশন করুন</button>
<p id="message"></p>
</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bfxykqfznkfcufchuvzw.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_xrwVK55_3--PCBTMTcGffQ_RpFL83WN";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("regForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("message");
  btn.disabled = true;
  msg.textContent = "তথ্য জমা হচ্ছে...";

  const f = new FormData(this);
  const record = {
    student_name: f.get("student_name").trim(),
    mobile: f.get("mobile").trim(),
    guardian_name: f.get("guardian_name").trim(),
    guardian_mobile: f.get("guardian_mobile").trim(),
    class_name: f.get("class_name"),
    address: f.get("address").trim()
  };

  const { error } = await db.from("student_registrations").insert([record]);

  if (error) {
    msg.textContent = "জমা হয়নি। তথ্য ও সেটিংস যাচাই করুন।";
    console.error(error);
  } else {
    msg.textContent = "রেজিস্ট্রেশন সফল হয়েছে!";
    this.reset();
  }

  btn.disabled = false;
});
</script>
</body>
</html>
