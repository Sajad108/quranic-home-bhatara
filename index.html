
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>দি কুরআনিক হোম ভাটেরা</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f7f1;
      padding: 20px;
      margin: 0;
    }
    .card {
      max-width: 450px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 2px 12px #ccc;
    }
    h2 {
      text-align: center;
      color: #126b40;
    }
    p { text-align: center; }
    label { display: block; margin-top: 14px; }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border-radius: 7px;
      border: 1px solid #bbb;
      font-size: 16px;
    }
    button {
      background: #126b40;
      color: white;
      border: 0;
      margin-top: 22px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>দি কুরআনিক হোম ভাটেরা</h2>
    <p>অনলাইন ভর্তি / রেজিস্ট্রেশন ফরম</p>

    <form onsubmit="event.preventDefault(); alert('ফরমের নমুনা পূরণ হয়েছে। তথ্য এখনো সংরক্ষিত হয়নি।');">
      <label>শিক্ষার্থীর নাম</label>
      <input type="text" required placeholder="সম্পূর্ণ নাম">

      <label>অভিভাবকের নাম</label>
      <input type="text" required placeholder="অভিভাবকের নাম">

      <label>মোবাইল নম্বর</label>
      <input type="tel" required placeholder="মোবাইল নম্বর">

      <label>শ্রেণি</label>
      <select required>
        <option value="">শ্রেণি নির্বাচন করুন</option>
        <option>নূরানী</option>
        <option>নাজেরা</option>
        <option>হিফজ</option>
        <option>অন্যান্য</option>
      </select>

      <label>ঠিকানা</label>
      <input type="text" required placeholder="গ্রাম / এলাকা">

      <button type="submit">রেজিস্ট্রেশন করুন</button>
    </form>
  </div>
</body>
</html>
