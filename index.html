
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>দি কুরআনিক হোম ভাটেরা | রেজিস্ট্রেশন</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 12px;
      background: #eef5f0;
      font-family: Arial, sans-serif;
      color: #193c2b;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000012;
    }
    header {
      text-align: center;
      background: #176b45;
      color: white;
      padding: 20px 12px;
      border-radius: 12px;
      margin-bottom: 22px;
    }
    h2 { margin: 0 0 8px; font-size: 23px; }
    header p { margin: 6px 0 0; font-size: 14px; }
    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      font-size: 15px;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #bdcfc3;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      background: #176b45;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.6;
    }
    .note {
      text-align: center;
      font-size: 13px;
      color: #52665a;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h2>দি কুরআনিক হোম ভাটেরা</h2>
      <p>১২ বছর পূর্তি উপলক্ষে</p>
      <p>অনলাইন রেজিস্ট্রেশন ফর্ম</p>
    </header>

    <form id="registrationForm">
   <div style="padding:15px; margin:15px 0; border:1px solid #e5a4bd; border-radius:10px; background:#fff5f8;">
  <h3 style="color:#d81b60; margin-top:0;">বিকাশ পেমেন্ট</h3>
  <p><strong>রেজিস্ট্রেশন ফি:</strong> ১৫০ টাকা</p>
  <p><strong>বিকাশ নম্বর:</strong> 01349237343</p>
  <p>পেমেন্ট করার পর রেজিস্ট্রেশন ফরম পূরণ করে জমা দিন।</p>
</div>
      <label>১. শিক্ষার্থীর নাম *</label>
      <input name="student_name" required>

      <label>২. পিতার নাম *</label>
      <input name="father_name" required>

      <label>৩. মাতার নাম *</label>
      <input name="mother_name" required>

      <label>৪. অধ্যয়নকাল বা শিক্ষা বর্ষ *</label>
      <input name="study_year" placeholder="যেমন: ২০১৫–২০২০" required>

      <label>৫. বর্তমান পেশা *</label>
      <input name="current_work" placeholder="যেমন: চাকরি, ব্যবসা, শিক্ষার্থী" required>

      <label>৬. বর্তমান ঠিকানা *</label>
      <textarea name="address" required></textarea>

      <label>৭. মোবাইল নম্বর *</label>
      <input name="mobile" type="tel" inputmode="tel"
             placeholder="আপনার মোবাইল নম্বর" required>

      <button type="submit" id="submitBtn">রেজিস্ট্রেশন জমা দিন</button>
      <p id="message" role="status"></p>
    </form>

    <p class="note">আপনার দেওয়া তথ্য রেজিস্ট্রেশনের কাজে ব্যবহার করা হবে।</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://bfxykqfznkfcufchuvzw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xrwVK55_3--PCBTMTcGffQ_RpFL83WN";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("registrationForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "তথ্য জমা হচ্ছে...";

      const f = new FormData(form);
      const record = {
        student_name: f.get("student_name").trim(),
        father_name: f.get("father_name").trim(),
        mother_name: f.get("mother_name").trim(),
        study_year: f.get("study_year").trim(),
        current_work: f.get("current_work").trim(),
        address: f.get("address").trim(),
        mobile: f.get("mobile").trim()
      };

      try {
        const { error } = await db
          .from("student_registrations_new")
          .insert([record]);

        if (error) throw error;

        message.textContent =
          "আলহামদুলিল্লাহ! আপনার রেজিস্ট্রেশন সফলভাবে জমা হয়েছে।";
        message.style.color = "green";
        form.reset();
      } catch (error) {
  console.error("Registration error:", error);
  message.textContent =
    "সমস্যা: " + (error.message || JSON.stringify(error));
  message.style.color = "red";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
